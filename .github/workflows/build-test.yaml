name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@master
      # Workaround for https://github.com/actions/runner-images/issues/12948
      - name: Prime CoreSimulator
        run: xcrun simctl list > /dev/null
      - name: Build and test
        run: xcodebuild clean test -project TimeLapseBuilder.xcodeproj -scheme TimeLapseBuilder-iOS -destination "platform=iOS Simulator,name=iPhone 16 Pro"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@master
      - name: Build and test
        run: xcodebuild clean test -project TimeLapseBuilder.xcodeproj -scheme TimeLapseBuilder-macOS
